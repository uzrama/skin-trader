[project]
name = "skin-trader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "uzrama", email = "mark.uzun7@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=24.1.0",
    "coloredlogs>=15.0.1",
    "gspread-asyncio>=2.0.0",
    "pandas>=2.3.2",
    "pandas-stubs>=2.3.2.250827",
    "patchright>=1.55.1",
    "playwright>=1.55.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "textual>=6.2.0",
    "uvloop>=0.21.0",
]

[project.scripts]
skin-trader = "skin_trader.main:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.black]
line-length = 160

[tool.ruff]
line-length = 160
ignore = ["E501"]

[tool.basedpyright]
reportUnusedCallResult = false
reportMissingTypeStubs = false
